name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.lock

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Test (pytest)
        run: pytest -q

  # Illustrative deployment stage. It runs only on pushes to main after tests
  # pass and does not require any real secrets or infrastructure; replace the
  # echo step with a real deploy (container push, Helm, etc.) when needed.
  deploy:
    name: Deploy (stub)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Deploy to staging
        run: |
          echo "Would deploy commit ${GITHUB_SHA} to staging here."
          echo "e.g. docker build/push, then 'kubectl rollout' or 'helm upgrade'."
